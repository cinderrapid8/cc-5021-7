<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>机械角色动画演示器 · 科技馆展项</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-dot"></span>
    <div>
      <h1>机械角色动画演示器</h1>
      <p>程序化零件 · 转动/滑动关节 · 时间曲线驱动 · 末端轨迹实时显示</p>
    </div>
  </div>
  <div class="toolbar">
    <button id="btn-add" class="btn">+ 添加节点</button>
    <div class="btn-group">
      <button id="preset-char" class="btn">机械角色</button>
      <button id="preset-twolink" class="btn">两节臂</button>
      <button id="preset-slide" class="btn">滑轨组合</button>
      <button id="preset-limit" class="btn">极限演示</button>
    </div>
    <div class="btn-group">
      <button id="btn-save" class="btn">保存</button>
      <button id="btn-export" class="btn">导出 JSON</button>
      <button id="btn-import" class="btn">导入 JSON</button>
      <input type="file" id="file-import" accept="application/json" hidden>
    </div>
    <label class="chk"><input type="checkbox" id="chk-grid"> 网格/世界轴</label>
    <label class="chk"><input type="checkbox" id="chk-axes"> 全部局部轴</label>
    <label class="chk"><input type="checkbox" id="chk-labels"> 标签</label>
    <label class="chk"><input type="checkbox" id="chk-trail"> 末端轨迹</label>
  </div>
</header>

<main class="layout">
  <aside class="panel left">
    <div class="panel-head">层级结构 <span class="panel-sub">求值顺序：自根向下的前序 DFS</span></div>
    <div id="tree" class="tree"></div>
    <div class="panel-head small">根变换（作用于整台角色）</div>
    <div id="root-editor" class="root-editor"></div>
  </aside>

  <section class="viewport">
    <canvas id="view"></canvas>
    <div class="legend">
      <span><i style="background:#ff5d5d"></i>X 轴</span>
      <span><i style="background:#5dd97a"></i>Y 轴</span>
      <span><i style="background:#5d9bff"></i>Z 轴</span>
      <span><i style="background:#fff;border-radius:50%"></i>白圈=关节轴</span>
      <span><i style="background:#ff4d4d;border-radius:50%"></i>红圈=触发限制</span>
    </div>
    <div class="camera-hint">左键拖动旋转 · Shift/右键拖动或滚轮缩放</div>

    <div class="timeline">
      <button id="btn-play" class="btn">暂停</button>
      <button id="btn-reset" class="btn">归零</button>
      <span id="time-label" class="time-label">t = 0.00 s</span>
      <input type="range" id="time-slider" min="0" max="8" step="0.01" value="0">
      <label class="tl-field">窗口
        <input type="number" id="duration" value="8" min="0.5" step="0.5" class="num tiny">s
      </label>
      <label class="tl-field">倍速
        <input type="number" id="speed" value="1" min="0.1" step="0.1" class="num tiny">
      </label>
      <label class="chk"><input type="checkbox" id="loop" checked> 循环</label>
      <button id="btn-clear-trail" class="btn">清轨迹</button>
    </div>
  </section>

  <aside class="panel right">
    <div class="tabs">
      <button class="tab active" data-tab="inspector-host">属性</button>
      <button class="tab" data-tab="matrix-host">矩阵</button>
      <button class="tab" data-tab="tests-host">解析核对</button>
    </div>
    <div id="inspector-host" class="tab-body active scroll"></div>
    <div id="matrix-host" class="tab-body scroll">
      <div id="matrix-panel" class="matrix-panel"></div>
    </div>
    <div id="tests-host" class="tab-body scroll">
      <div id="tests-summary" class="summary"></div>
      <div id="tests-panel" class="tests-panel"></div>
      <p class="disclaimer">本展项仅用于视觉展示与教学，不连接、不控制任何真实机械设备。</p>
    </div>
  </aside>
</main>

<footer class="statusbar">
  <span>末端位置：<b id="status-tip">—</b></span>
  <span id="status-limit" class="limit-ok">—</span>
  <span id="status-errors" class="status-errors"></span>
</footer>

<div id="flash" class="flash"></div>

<script src="js/math3d.js"></script>
<script src="js/rig.js"></script>
<script src="js/kinematics.js"></script>
<script src="js/renderer.js"></script>
<script src="js/state.js"></script>
<script src="js/inspector.js"></script>
<script src="js/tests.js"></script>
<script src="js/app.js"></script>
<script>
  document.querySelectorAll('.tab').forEach((t) => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((x) => x.classList.remove('active'));
      document.querySelectorAll('.tab-body').forEach((x) => x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById(t.dataset.tab).classList.add('active');
    });
  });
</script>
</body>
</html>
